name: Sync Bodega productos

on:
  workflow_dispatch:
  push:
    paths:
      - servare/data/productos-migrados.json
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir productos al Google Sheet
        env:
          BODEGA_API_TOKEN: ${{ secrets.BODEGA_API_TOKEN }}
        run: python3 servare/scripts/sync-productos.py
